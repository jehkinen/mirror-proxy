<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1214;
      --elev: #121a1d;
      --elev-2: #182226;
      --line: rgba(148, 220, 210, 0.08);
      --line-strong: rgba(148, 220, 210, 0.14);
      --text: #e8f4f2;
      --muted: #7a9692;
      --faint: #4f6663;
      --mint: #5eead4;
      --mint-deep: #2dd4bf;
      --mint-soft: rgba(94, 234, 212, 0.12);
      --mint-ink: #042f2e;
      --bad: #fb7185;
      --r: 10px;
      --r-sm: 7px;
      --font: "Inter", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    button {
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      border: 0;
      box-shadow: none;
    }

    body {
      margin: 0;
      width: 328px;
      padding: 14px;
      font: 12.5px/1.4 var(--font);
      color: var(--text);
      background:
        radial-gradient(120% 80% at 100% -20%, rgba(94, 234, 212, 0.08), transparent 55%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .logo {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 7px;
    }

    .brand-name {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
    }

    .brand-name span {
      color: var(--mint);
      font-weight: 600;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      max-width: 58%;
      padding: 4px 8px;
      background: var(--elev);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .status-chip.live {
      color: var(--text);
      background: var(--mint-soft);
      border-color: rgba(94, 234, 212, 0.28);
    }

    .status-flag {
      font-size: 11px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .status-text {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-ping {
      margin-left: 1px;
      flex: 0 0 auto;
      color: var(--mint);
      font-weight: 600;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--faint);
    }

    .power-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--elev);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
    }

    .power-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .power-label {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .power-state {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--faint);
    }

    .power-state.live {
      color: var(--mint);
    }

    .switch {
      flex: 0 0 auto;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .switch:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .switch-track {
      display: block;
      width: 44px;
      height: 26px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      position: relative;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .switch.on .switch-track {
      background: var(--mint-soft);
      border-color: rgba(94, 234, 212, 0.42);
    }

    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease;
    }

    .switch.on .switch-thumb {
      transform: translateX(18px);
      background: var(--mint);
    }

    .accordion {
      margin-top: 8px;
    }

    .accordion-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    .accordion-trigger:hover {
      color: var(--text);
    }

    .accordion-chevron {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--faint);
      transition: transform 0.15s ease, color 0.12s ease;
    }

    .accordion-chevron svg {
      width: 10px;
      height: 10px;
      display: block;
    }

    .accordion.open .accordion-chevron {
      transform: rotate(180deg);
      color: var(--mint);
    }

    .accordion-body { display: none; }
    .accordion.open .accordion-body { display: block; }

    .add-form {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #proxyLabel,
    #proxyString {
      width: 100%;
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 0 10px;
      font: 11.5px/1 var(--font);
      color: var(--text);
      background: var(--elev);
      outline: none;
    }

    #proxyString {
      font-family: var(--mono);
    }

    #proxyLabel::placeholder,
    #proxyString::placeholder { color: var(--faint); }

    #proxyLabel:focus,
    #proxyString:focus {
      border-color: rgba(94, 234, 212, 0.45);
      background: var(--elev-2);
    }

    .input-mode-tabs {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: var(--elev);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
    }

    .mode-tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .mode-tab:hover {
      color: var(--text);
    }

    .mode-tab.active {
      color: var(--mint);
      background: var(--mint-soft);
    }

    .input-panel.hidden { display: none; }

    .fields-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fields-form.hidden { display: none; }

    .fields-row {
      display: flex;
      gap: 6px;
    }

    .fields-form input {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 0 10px;
      font: 11.5px/1 var(--mono);
      color: var(--text);
      background: var(--elev);
      outline: none;
    }

    .fields-form input.port {
      flex: 0 0 72px;
      max-width: 72px;
    }

    .fields-form input::placeholder { color: var(--faint); }

    .fields-form input:focus {
      border-color: rgba(94, 234, 212, 0.45);
      background: var(--elev-2);
    }

    .bulk-form.hidden { display: none; }

    #bulkText {
      width: 100%;
      min-height: 88px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      font: 11.5px/1.45 var(--mono);
      color: var(--text);
      background: var(--elev);
      outline: none;
    }

    #bulkText::placeholder { color: var(--faint); }

    #bulkText:focus {
      border-color: rgba(94, 234, 212, 0.45);
      background: var(--elev-2);
    }

    .hint {
      margin: 0;
      min-height: 0;
      color: var(--faint);
      font-size: 10.5px;
      font-family: var(--mono);
    }

    .hint:empty { display: none; }
    .hint.ok { color: var(--mint); }
    .hint.bad { color: var(--bad); }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .actions button {
      border: 0;
      border-radius: 6px;
      padding: 5px 10px;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, opacity 0.12s ease;
    }

    .actions button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .primary {
      color: var(--mint-ink);
      background: var(--mint);
    }

    .primary:hover:not(:disabled) {
      background: #7af0dc;
    }

    .secondary {
      color: var(--muted);
      background: var(--elev);
      border: 1px solid var(--line-strong);
    }

    .secondary:hover:not(:disabled) {
      color: var(--text);
      background: var(--elev-2);
      border-color: rgba(94, 234, 212, 0.28);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 168px;
      overflow: auto;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb {
      background: rgba(94, 234, 212, 0.2);
      border-radius: 999px;
    }

    .empty {
      padding: 14px 8px;
      text-align: center;
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 500;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px;
      align-items: center;
      padding: 8px 8px 8px 10px;
      border-radius: var(--r-sm);
      background: transparent;
      transition: background 0.12s ease;
    }

    .item:hover {
      background: var(--elev);
    }

    .item.active {
      background: var(--mint-soft);
      box-shadow: inset 2px 0 0 var(--mint);
    }

    .item-main {
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      min-width: 0;
      font: inherit;
      outline: none;
    }

    .item-main:focus-visible {
      outline: 1px solid rgba(94, 234, 212, 0.35);
      outline-offset: 1px;
      border-radius: 4px;
    }

    .item-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .item-meta {
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      font-size: 10.5px;
      color: var(--faint);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-active-mark {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.18);
    }

    .item-del {
      border: 0;
      padding: 3px 6px;
      background: transparent;
      color: var(--faint);
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1;
    }

    .item-del:hover {
      color: var(--bad);
      background: rgba(251, 113, 133, 0.1);
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .item-edit {
      border: 0;
      padding: 3px 6px;
      background: transparent;
      color: var(--faint);
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1;
    }

    .item-edit:hover {
      color: var(--mint);
      background: rgba(94, 234, 212, 0.1);
    }

    .item-rename-input {
      width: 100%;
      min-width: 0;
      height: 22px;
      border: 1px solid rgba(94, 234, 212, 0.45);
      border-radius: 5px;
      padding: 0 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }

    .item-title[title] {
      cursor: text;
    }

    .toast {
      margin-top: 8px;
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 500;
      display: none;
      border-radius: var(--r-sm);
      background: var(--elev);
      color: var(--muted);
    }

    .toast.show { display: block; }
    .toast.ok {
      color: var(--mint);
      background: var(--mint-soft);
    }
    .toast.err {
      color: var(--bad);
      background: rgba(251, 113, 133, 0.1);
    }

    .busy .primary,
    .busy .secondary,
    .busy .switch {
      pointer-events: none;
    }

    .confirm-sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .confirm-sheet.hidden { display: none; }

    .confirm-sheet.open { pointer-events: auto; }

    .confirm-backdrop {
      position: absolute;
      inset: 0;
      padding: 0;
      background: rgba(12, 18, 20, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
      cursor: default;
    }

    .confirm-sheet.open .confirm-backdrop {
      opacity: 1;
    }

    .confirm-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 14px 14px;
      background: var(--elev-2);
      border-top: 1px solid var(--line-strong);
      border-radius: 14px 14px 0 0;
      transform: translateY(100%);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.28);
    }

    .confirm-sheet.open .confirm-drawer {
      transform: translateY(0);
    }

    .confirm-handle {
      width: 34px;
      height: 3px;
      margin: 0 auto 10px;
      border-radius: 999px;
      background: rgba(148, 220, 210, 0.22);
    }

    .confirm-title {
      margin: 0 0 4px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }

    .confirm-text {
      margin: 0 0 12px;
      font-size: 11.5px;
      color: var(--muted);
      font-family: var(--mono);
      word-break: break-all;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .confirm-actions .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .btn-secondary {
      color: var(--text);
      background: var(--elev);
      border: 1px solid var(--line-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg);
      border-color: rgba(94, 234, 212, 0.28);
    }

    .btn-primary {
      color: var(--mint-ink);
      background: var(--mint);
    }

    .btn-primary:hover:not(:disabled) {
      background: #7af0dc;
    }

    .btn-danger {
      color: #fff;
      background: var(--bad);
    }

    .btn-danger:hover:not(:disabled) {
      background: #f43f5e;
    }

    .backup-section {
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .backup-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .icon-btn {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
      color: var(--muted);
      background: var(--elev);
      border: 1px solid var(--line-strong);
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .icon-btn:hover:not(:disabled) {
      color: var(--mint);
      background: var(--elev-2);
      border-color: rgba(94, 234, 212, 0.28);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .backup-hint {
      flex: 1;
      min-width: 0;
      font-size: 10px;
      color: var(--faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img class="logo" src="icons/icon-128.png" alt="" />
      <h1 class="brand-name">Mirror <span>Proxy</span></h1>
    </div>
    <div id="statusChip" class="status-chip">
      <span id="statusFlag" class="status-flag"></span>
      <span id="statusText" class="status-text">off</span>
      <span id="statusPing" class="status-ping"></span>
    </div>
  </div>

  <div class="stack">
    <section>
      <div class="power-row">
        <div class="power-copy">
          <span class="power-label">Proxy</span>
          <span id="powerState" class="power-state">Off</span>
        </div>
        <button
          id="toggle"
          class="switch off"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Enable proxy"
        >
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </button>
      </div>

      <div id="addAccordion" class="accordion">
        <button
          id="addToggle"
          class="accordion-trigger"
          type="button"
          aria-expanded="false"
          aria-controls="addPanel"
        >
          <span>Add proxy</span>
          <span class="accordion-chevron" aria-hidden="true">
            <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
        <div id="accordionBody" class="accordion-body">
          <div id="addPanel" class="add-form">
            <input
              id="proxyLabel"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Name (optional)"
            />
            <div class="input-mode-tabs" role="tablist" aria-label="Input mode">
              <button id="modeTabString" class="mode-tab active" type="button" role="tab" aria-selected="true">Line</button>
              <button id="modeTabFields" class="mode-tab" type="button" role="tab" aria-selected="false">Fields</button>
              <button id="modeTabBulk" class="mode-tab" type="button" role="tab" aria-selected="false">Bulk</button>
            </div>
            <div id="stringPanel" class="input-panel">
              <input
                id="proxyString"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="host:port@user:pass or Name :: host:port"
              />
            </div>
            <div id="fieldsForm" class="fields-form input-panel hidden">
              <div class="fields-row">
                <input id="fieldHost" type="text" spellcheck="false" autocomplete="off" placeholder="Host" />
                <input id="fieldPort" class="port" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" placeholder="Port" />
              </div>
              <div class="fields-row">
                <input id="fieldUser" type="text" spellcheck="false" autocomplete="off" placeholder="Username" />
                <input id="fieldPass" type="password" spellcheck="false" autocomplete="off" placeholder="Password" />
              </div>
            </div>
            <div id="bulkForm" class="bulk-form input-panel hidden">
              <textarea
                id="bulkText"
                spellcheck="false"
                autocomplete="off"
                placeholder="One proxy per line&#10;host:port@user:pass&#10;Name :: host:port@user:pass"
              ></textarea>
            </div>
            <p class="hint" id="parsed"></p>
            <div class="actions">
              <button id="check" class="secondary" type="button">Check</button>
              <button id="save" class="primary" type="button">Save</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-label">Proxies</h2>
      <div id="list" class="list"></div>
    </section>

    <section class="backup-section">
      <div class="backup-bar">
        <button id="exportBackup" class="icon-btn" type="button" title="Export backup" aria-label="Export backup">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 2.5v7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M5.5 7 8 9.5 10.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 11.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="importBackupBtn" class="icon-btn" type="button" title="Import backup" aria-label="Import backup">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 11.5v-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M5.5 6 8 3.5 10.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.5 11.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
        <span id="backupHint" class="backup-hint"></span>
      </div>
    </section>
  </div>

  <div id="msg" class="toast"></div>

  <div id="confirmDialog" class="confirm-sheet hidden" role="presentation">
    <button id="confirmBackdrop" class="confirm-backdrop" type="button" aria-label="Close"></button>
    <div class="confirm-drawer" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="confirm-handle" aria-hidden="true"></div>
      <p id="confirmTitle" class="confirm-title">Remove proxy?</p>
      <p id="confirmText" class="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="confirmOk" class="btn btn-danger" type="button">Remove</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
